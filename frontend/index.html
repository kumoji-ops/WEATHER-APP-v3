<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER-APPv3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=rainy" />
</head>
<body>

    <!-- ✅ left side - outside the card -->
    <div class="weather">
        <h1 class="temp">25°</h1>
        <div class = "city-info">
            <h2 class="city">New York</h2>
            <p class="date">06:09 - Sunday, 6 Oct '19</p>
        </div>
        <span class="material-symbols-outlined">
rainy
</span>
    </div>

    <!-- ✅ right side - the card -->
    <div class="card">
        <div class="search">
            <input id="cityInput" placeholder="Enter city name" spellcheck="false">
            <button id="getWeatherBtn"><img src="images/search.png"></button>
        </div>

        <h1 class="title-weatherDetails">Weather Details</h1>

<div class="details">
    <div class="col">
        <p class="humiditytext">Cloudy</p>
        <p class="humidity">86%</p>
    </div>
    <div class="col">
        <p class="humiditytext">Rainy</p>
        <p class="humidity">8mm</p>
    </div>
    <div class="col">
        <p class="humiditytext">Humidity</p>
        <p class="humidity">62%</p>
    </div>
    <div class="col">
        <p class="windtext">Wind Speed</p>
        <p class="wind">8 km/h</p>
    </div>
</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
