<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER-APPv3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="card">
        <div class="search">
            <input id="cityInput" placeholder="Enter city name" spellcheck="false">
            <button id="getWeatherBtn"><img src="images/search.png" ></button>
        </div>
        <div class="weather">
            <img src="images/rain.png" class="weather-icon">
            <h1 class="temp">25°C</h1>
            <h2 class="city">New York</h2>
            

            <div class="details">
                <div class="col">
                    <div class="col-top">
                        <img src="images/humidity.png" class="humidity-icon">
                        <p class="humidity">50%</p>
                    </div>
                    <p>Humidity</p>
                </div>
                <div class="col">
                    <div class="col-top">
                        <img src="images/wind.png" class="wind-icon">
                        <p class="wind">15 km/h</p>
                    </div>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
